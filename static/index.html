<!doctype html>
<html lang="__APP_LANG__">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>__PAGE_TITLE__</title>
  __APP_CONFIG_SCRIPT__
  <link rel="stylesheet" href="/static/styles.css" />
</head>

<body>
  <main class="app-shell">
    <section class="search-pane" aria-label="검색 결과" data-i18n-attr="aria-label:searchResults">
      <header class="app-title">
        <span>__APP_TITLE__</span>
        <button id="logout-button" type="button" class="logout-button">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span data-i18n="logout">로그아웃</span>
        </button>
      </header>
      <form id="search-form" class="toolbar" autocomplete="off">
        <div class="search-input-wrapper">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input id="query-input" name="mail_rag_query" type="search" autocomplete="off" list="search-history"
            placeholder="검색어를 입력하세요." aria-label="검색어"
            data-i18n-attr="placeholder:searchPlaceholder,aria-label:searchTermLabel" />
          <datalist id="search-history"></datalist>
          <button id="search-button" type="submit" data-i18n="search">검색</button>
        </div>
        <div class="filters-container">
          <div class="sort-group" aria-label="정렬 방식" data-i18n-attr="aria-label:sortMode">
            <button class="sort-button active" type="button" data-sort="relevance" aria-pressed="true"
              data-i18n="sortRelevance">일치도순</button>
            <button class="sort-button" type="button" data-sort="desc" aria-pressed="false"
              data-i18n="sortDesc">최신순</button>
            <button class="sort-button" type="button" data-sort="asc" aria-pressed="false"
              data-i18n="sortAsc">오래된순</button>
          </div>
          <div class="filter-group">
            <button id="exact-input" type="button" class="exact-toggle" aria-pressed="false"
              title="단어가 정확히 일치하는 메일만 검색합니다." data-i18n-attr="title:exactTitle" data-i18n="exact">완전일치</button>
            <div class="limit-control" title="값을 늘릴 수록 검색어와 덜 일치하는 메일까지 나타납니다."
              data-i18n-attr="title:limitTitle">
              <div class="limit-header">
                <label class="limit-label" for="limit-input"><span data-i18n="limit">결과수</span> <output id="limit-value">30</output></label>
              </div>
              <div class="limit-slider-row">
                <span class="limit-bound">10</span>
                <input id="limit-input" name="limit" type="range" min="10" max="100" value="30" step="1"
                  aria-label="결과수" data-i18n-attr="aria-label:limit" />
                <span id="limit-max-value" class="limit-bound">100</span>
              </div>
            </div>
            <button id="advanced-toggle" type="button" class="advanced-toggle" aria-expanded="false"
              aria-controls="advanced-panel" data-i18n="advanced">고급</button>
          </div>
        </div>
        <div id="advanced-panel" class="advanced-panel" hidden>
          <div class="advanced-field">
            <label for="from-input" data-i18n="fromLabel">보낸사람</label>
            <input id="from-input" name="from" type="text" autocomplete="off"
              placeholder="name@example.com" data-i18n-attr="placeholder:fromPlaceholder" />
          </div>
          <div class="advanced-field">
            <label for="date-from-input" data-i18n="dateFromLabel">시작일</label>
            <input id="date-from-input" name="date_from" type="date" />
          </div>
          <div class="advanced-field">
            <label for="date-to-input" data-i18n="dateToLabel">종료일</label>
            <input id="date-to-input" name="date_to" type="date" />
          </div>
          <div class="advanced-field">
            <label for="attachment-input" data-i18n="attachmentLabel">첨부파일</label>
            <select id="attachment-input" name="has_attachment">
              <option value="" data-i18n="attachmentAny">모두</option>
              <option value="true" data-i18n="attachmentYes">있음</option>
              <option value="false" data-i18n="attachmentNo">없음</option>
            </select>
          </div>
          <button id="advanced-reset" type="button" class="advanced-reset" data-i18n="advancedReset">초기화</button>
        </div>
      </form>
      <div class="meta-row">
        <div class="meta-left">
          <span id="result-summary" data-i18n="enterSearchTerm">검색어를 입력하세요.</span>
          <span id="status-text"></span>
        </div>
        <div class="nav-controls">
          <button id="nav-up-button" type="button" class="nav-button" aria-label="이전 메일"
            data-i18n-attr="aria-label:previousMail" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
          </button>
          <button id="nav-down-button" type="button" class="nav-button" aria-label="다음 메일"
            data-i18n-attr="aria-label:nextMail" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
        </div>
      </div>
      <div id="result-list" class="result-list" role="listbox" aria-label="이메일 검색 결과"
        data-i18n-attr="aria-label:emailSearchResults"></div>
    </section>

    <section class="viewer-pane" aria-label="이메일 내용" data-i18n-attr="aria-label:emailContent">
      <div class="viewer-header">
        <button id="mobile-back-button" class="mobile-back-button" type="button" aria-label="Back" data-i18n-attr="aria-label:backToList">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
        </button>
        <div class="viewer-title">
          <div id="viewer-subject" data-i18n="selectMail">메일을 선택하세요.</div>
          <div id="viewer-meta"></div>
        </div>
        <div class="viewer-actions" style="display: flex; gap: 8px;">
          <a id="download-eml-link" class="open-link" href="#" download aria-disabled="true"
            data-i18n-attr="aria-label:downloadEml,title:downloadEml" aria-label=".eml 다운로드" title=".eml 다운로드">
            <svg class="action-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            <span class="action-label" data-i18n="downloadEml">.eml 다운로드</span>
          </a>
          <a id="open-link" class="open-link" href="#" target="_blank" rel="noreferrer" aria-disabled="true"
            data-i18n-attr="aria-label:openInNewWindow,title:openInNewWindow" aria-label="새 창에서 열기" title="새 창에서 열기">
            <svg class="action-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
            <span class="action-label" data-i18n="openInNewWindow">새 창에서 열기</span>
          </a>
        </div>
      </div>
      <div id="mail-detail" class="mail-detail">
        <div class="empty-state" data-i18n="selectMailHelp">메일을 선택하면 검색 결과의 본문 미리보기가 여기에 표시됩니다.</div>
      </div>
    </section>
  </main>
  <script src="/static/i18n.js"></script>
  <script src="/static/app.js"></script>
</body>

</html>
